<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>censuschat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --bubble-user: #2563eb;
    --bubble-user-fg: #ffffff;
    --bubble-assistant: #f2f2f2;
    --bubble-assistant-fg: #1a1a1a;
    --error: #b3261e;
    --banner: #fff3cd;
    --banner-fg: #7a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --border: #2a2a2a;
      --bubble-assistant: #1e1e1e;
      --bubble-assistant-fg: #eaeaea;
      --banner: #3a2f00;
      --banner-fg: #ffd76a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 12px;
  }
  header {
    padding: 16px 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #banner {
    display: none;
    padding: 8px 12px;
    margin-top: 10px;
    border-radius: 8px;
    background: var(--banner);
    color: var(--banner-fg);
    font-size: 13px;
  }
  #banner.show { display: block; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.4;
    font-size: 14.5px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-fg);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.error {
    background: var(--error);
    color: #fff;
  }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
    min-height: 16px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 4px 16px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 14.5px;
  }
  #input:focus { outline: 2px solid var(--bubble-user); }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--bubble-user);
    color: #fff;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>censuschat</h1>
    <p>Ask about US population, income, or housing from the 2020 ACS 5-year estimates.</p>
    <div id="banner"></div>
  </header>

  <div id="log"></div>
  <div class="status-line" id="status"></div>

  <form id="form">
    <input id="input" type="text" placeholder="e.g. What's the population of Travis County, Texas?" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
(function () {
  "use strict";

  const sessionId = (function () {
    const key = "censuschat_session_id";
    let id = localStorage.getItem(key);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(key, id);
    }
    return id;
  })();

  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const bannerEl = document.getElementById("banner");

  function addRow(role) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return bubble;
  }

  function setStatus(text) {
    statusEl.textContent = text || "";
  }

  function setBusy(busy) {
    inputEl.disabled = busy;
    sendEl.disabled = busy;
  }

  async function checkHealth() {
    try {
      const res = await fetch("/api/health");
      const data = await res.json();
      if (data.status === "degraded") {
        bannerEl.textContent =
          "Running in degraded mode (snapshot: " + data.snapshot +
          ", Snowflake: " + data.snowflake +
          "). Answers may be limited.";
        bannerEl.classList.add("show");
      }
    } catch (e) {
      // Health check itself failing is not fatal to the page loading.
    }
  }

  async function sendMessage(message) {
    addRow("user").textContent = message;
    const assistantBubble = addRow("assistant");
    setBusy(true);
    setStatus("thinking…");

    let response;
    try {
      response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: message }),
      });
    } catch (e) {
      assistantBubble.classList.add("error");
      assistantBubble.textContent = "Couldn't reach the server. Check your connection and try again.";
      setBusy(false);
      setStatus("");
      return;
    }

    if (!response.ok || !response.body) {
      assistantBubble.classList.add("error");
      assistantBubble.textContent = "Something went wrong talking to the server.";
      setBusy(false);
      setStatus("");
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantText = "";
    let ended = false;

    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          if (!rawEvent.startsWith("data: ")) continue;

          let event;
          try {
            event = JSON.parse(rawEvent.slice(6));
          } catch (e) {
            continue;
          }

          if (event.type === "token") {
            assistantText += event.data.text;
            assistantBubble.textContent = assistantText;
            logEl.scrollTop = logEl.scrollHeight;
          } else if (event.type === "tool_start") {
            setStatus("using " + event.data.tool + "…");
          } else if (event.type === "tool_end") {
            setStatus(event.data.ok ? "" : "a tool call failed, recovering…");
          } else if (event.type === "error") {
            ended = true;
            assistantBubble.classList.add("error");
            assistantBubble.textContent = assistantText || event.data.message;
            if (assistantText) {
              const errRow = addRow("assistant");
              errRow.classList.add("error");
              errRow.textContent = event.data.message;
            }
            setStatus("");
          } else if (event.type === "done") {
            ended = true;
            setStatus("");
          }
        }
      }
    } finally {
      if (!ended) {
        // Stream closed without a terminal event — an honest signal something
        // went wrong client- or network-side, not a silent success.
        setStatus("");
        if (!assistantText) {
          assistantBubble.classList.add("error");
          assistantBubble.textContent = "The response stopped unexpectedly. Please try again.";
        }
      }
      setBusy(false);
      inputEl.focus();
    }
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;
    inputEl.value = "";
    sendMessage(message);
  });

  checkHealth();
  inputEl.focus();
})();
</script>
</body>
</html>
