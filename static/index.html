<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>censuschat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --bubble-user: #2563eb;
    --bubble-user-fg: #ffffff;
    --bubble-assistant: #f2f2f2;
    --bubble-assistant-fg: #1a1a1a;
    --error: #b3261e;
    --ok: #1a7f37;
    --banner: #fff3cd;
    --banner-fg: #7a5b00;
    --card: #f7f7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --border: #2a2a2a;
      --bubble-assistant: #1e1e1e;
      --bubble-assistant-fg: #eaeaea;
      --banner: #3a2f00;
      --banner-fg: #ffd76a;
      --ok: #57ab5a;
      --card: #1b1b1b;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 12px;
  }
  header {
    padding: 16px 4px 0;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header p {
    margin: 4px 0 12px;
    font-size: 13px;
    color: var(--muted);
  }
  #banner {
    display: none;
    padding: 8px 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    background: var(--banner);
    color: var(--banner-fg);
    font-size: 13px;
  }
  #banner.show { display: block; }

  nav.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button.active {
    color: var(--fg);
    border-bottom-color: var(--bubble-user);
    font-weight: 600;
  }

  .panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .panel.active { display: flex; }

  /* Chat panel */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.4;
    font-size: 14.5px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-fg);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.error {
    background: var(--error);
    color: #fff;
  }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
    min-height: 16px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 4px 16px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 14.5px;
  }
  #input:focus { outline: 2px solid var(--bubble-user); }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--bubble-user);
    color: #fff;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  /* Evals + Flow panels (scrollable content areas) */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px 24px;
  }
  .eval-summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .eval-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .eval-stat .n { font-size: 20px; font-weight: 700; }
  .eval-stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table.evals { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.evals th, table.evals td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.evals th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.pass { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .badge.fail { background: color-mix(in srgb, var(--error) 20%, transparent); color: var(--error); }
  .answer-preview { color: var(--muted); font-size: 12.5px; max-width: 320px; }
  .empty-state { color: var(--muted); font-size: 13.5px; padding: 8px 4px; }

  /* Flow diagram panel */
  .flow-turn {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    background: var(--card);
  }
  .flow-turn h3 { margin: 0 0 8px; font-size: 13.5px; }
  .flow-steps { list-style: none; margin: 0; padding: 0; }
  .flow-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 12.5px;
    border-left: 2px solid var(--border);
    padding-left: 10px;
    margin-left: 4px;
  }
  .flow-steps li .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0; margin-left: -15px;
    border: 2px solid var(--bg);
  }
  .flow-steps li.ok .dot { background: var(--ok); }
  .flow-steps li.fail .dot { background: var(--error); }
  .flow-steps li .ms { color: var(--muted); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
  <header>
    <h1>censuschat</h1>
    <p>Ask about US population, income, or housing from the 2020 ACS 5-year estimates.</p>
    <div id="banner"></div>
    <nav class="tabs">
      <button type="button" data-tab="chat" class="active">Chat</button>
      <button type="button" data-tab="evals">Evals</button>
      <button type="button" data-tab="flow">Flow Diagram</button>
    </nav>
  </header>

  <section class="panel active" id="panel-chat">
    <div id="log"></div>
    <div class="status-line" id="status"></div>
    <form id="form">
      <input id="input" type="text" placeholder="e.g. What's the population of Travis County, Texas?" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="panel" id="panel-evals">
    <div class="scroll-area" id="evals-content">
      <p class="empty-state">Loading…</p>
    </div>
  </section>

  <section class="panel" id="panel-flow">
    <div class="scroll-area" id="flow-content">
      <p class="empty-state">Send a chat message to see its flow through the agent here — guardrail decision, each tool call, and timing.</p>
    </div>
  </section>

<script>
(function () {
  "use strict";

  const sessionId = (function () {
    const key = "censuschat_session_id";
    let id = localStorage.getItem(key);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(key, id);
    }
    return id;
  })();

  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const bannerEl = document.getElementById("banner");
  const evalsContentEl = document.getElementById("evals-content");
  const flowContentEl = document.getElementById("flow-content");

  // ---------- Tabs ----------
  const tabButtons = document.querySelectorAll("nav.tabs button");
  const panels = {
    chat: document.getElementById("panel-chat"),
    evals: document.getElementById("panel-evals"),
    flow: document.getElementById("panel-flow"),
  };
  let evalsLoaded = false;

  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(panels).forEach(function (k) { panels[k].classList.remove("active"); });
      panels[btn.dataset.tab].classList.add("active");
      if (btn.dataset.tab === "evals" && !evalsLoaded) {
        loadEvals();
      }
    });
  });

  // ---------- Evals tab ----------
  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  function renderEvalRun(run, label) {
    if (!run) return "";
    const rows = (run.results || []).map(function (r) {
      const badge = r.passed
        ? '<span class="badge pass">pass</span>'
        : '<span class="badge fail">fail</span>';
      const checks = (r.checks || [])
        .map(function (c) { return (c.passed ? "✓ " : "✗ ") + c.check.type; })
        .join("<br>");
      return (
        "<tr><td>" + escapeHtml(r.scenario_id) + "</td>" +
        "<td>" + escapeHtml(r.category) + "</td>" +
        "<td>" + badge + "</td>" +
        "<td>" + checks + "</td>" +
        "<td>" + r.elapsed_s.toFixed(1) + "s</td>" +
        '<td class="answer-preview">' + escapeHtml((r.answer_final || "").slice(0, 140)) + "</td></tr>"
      );
    }).join("");

    return (
      "<h2 style='font-size:14px;margin:20px 0 8px'>" + label + "</h2>" +
      "<div class='eval-summary'>" +
        "<div class='eval-stat'><div class='n'>" + (run.pass_rate * 100).toFixed(0) + "%</div><div class='l'>pass rate</div></div>" +
        "<div class='eval-stat'><div class='n'>" + run.results.length + "</div><div class='l'>scenarios</div></div>" +
        "<div class='eval-stat'><div class='n'>" + escapeHtml(run.git_sha) + "</div><div class='l'>git sha</div></div>" +
      "</div>" +
      "<table class='evals'><thead><tr><th>Scenario</th><th>Category</th><th>Result</th><th>Checks</th><th>Time</th><th>Answer</th></tr></thead>" +
      "<tbody>" + rows + "</tbody></table>"
    );
  }

  async function loadEvals() {
    evalsLoaded = true;
    try {
      const res = await fetch("/api/evals");
      const data = await res.json();
      if (!data.latest) {
        evalsContentEl.innerHTML = '<p class="empty-state">No eval runs recorded yet.</p>';
        return;
      }
      let html = renderEvalRun(data.latest, "Latest run (" + new Date(data.latest.run_at).toLocaleString() + ")");
      if (data.previous) {
        html += renderEvalRun(data.previous, "Previous run (" + new Date(data.previous.run_at).toLocaleString() + ")");
      }
      evalsContentEl.innerHTML = html;
    } catch (e) {
      evalsContentEl.innerHTML = '<p class="empty-state">Couldn\'t load eval results.</p>';
    }
  }

  // ---------- Flow Diagram tab ----------
  let turnCounter = 0;

  function startFlowTurn(message) {
    turnCounter += 1;
    if (flowContentEl.querySelector(".empty-state")) {
      flowContentEl.innerHTML = "";
    }
    const wrap = document.createElement("div");
    wrap.className = "flow-turn";
    const title = document.createElement("h3");
    title.textContent = "Turn " + turnCounter + ": " + message;
    const steps = document.createElement("ul");
    steps.className = "flow-steps";
    wrap.appendChild(title);
    wrap.appendChild(steps);
    flowContentEl.prepend(wrap);
    return steps;
  }

  function addFlowStep(stepsEl, label, status) {
    const li = document.createElement("li");
    if (status) li.classList.add(status);
    li.innerHTML = '<span class="dot"></span><span>' + escapeHtml(label) + "</span>";
    stepsEl.appendChild(li);
    return li;
  }

  // ---------- Chat ----------
  function addRow(role) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return bubble;
  }

  function setStatus(text) {
    statusEl.textContent = text || "";
  }

  function setBusy(busy) {
    inputEl.disabled = busy;
    sendEl.disabled = busy;
  }

  async function checkHealth() {
    try {
      const res = await fetch("/api/health");
      const data = await res.json();
      if (data.status === "degraded") {
        bannerEl.textContent =
          "Running in degraded mode (snapshot: " + data.snapshot +
          ", Snowflake: " + data.snowflake +
          "). Answers may be limited.";
        bannerEl.classList.add("show");
      }
    } catch (e) {
      // Health check itself failing is not fatal to the page loading.
    }
  }

  async function sendMessage(message) {
    addRow("user").textContent = message;
    const assistantBubble = addRow("assistant");
    const flowSteps = startFlowTurn(message);
    let toolStepsSeen = false;
    setBusy(true);
    setStatus("thinking…");

    let response;
    try {
      response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: message }),
      });
    } catch (e) {
      assistantBubble.classList.add("error");
      assistantBubble.textContent = "Couldn't reach the server. Check your connection and try again.";
      addFlowStep(flowSteps, "Network error", "fail");
      setBusy(false);
      setStatus("");
      return;
    }

    if (!response.ok || !response.body) {
      assistantBubble.classList.add("error");
      assistantBubble.textContent = "Something went wrong talking to the server.";
      addFlowStep(flowSteps, "Server error (" + response.status + ")", "fail");
      setBusy(false);
      setStatus("");
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantText = "";
    let ended = false;

    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          if (!rawEvent.startsWith("data: ")) continue;

          let event;
          try {
            event = JSON.parse(rawEvent.slice(6));
          } catch (e) {
            continue;
          }

          if (event.type === "token") {
            assistantText += event.data.text;
            assistantBubble.textContent = assistantText;
            logEl.scrollTop = logEl.scrollHeight;
          } else if (event.type === "tool_start") {
            toolStepsSeen = true;
            setStatus("using " + event.data.tool + "…");
            addFlowStep(flowSteps, event.data.tool + " — running…");
          } else if (event.type === "tool_end") {
            setStatus(event.data.ok ? "" : "a tool call failed, recovering…");
            const items = flowSteps.querySelectorAll("li");
            const last = items[items.length - 1];
            if (last) {
              last.classList.add(event.data.ok ? "ok" : "fail");
              const label = last.querySelector("span:last-of-type");
              label.textContent = label.textContent.replace(" — running…", event.data.ok ? " — ok" : " — failed");
              const ms = document.createElement("span");
              ms.className = "ms";
              ms.textContent = event.data.elapsed_ms + "ms";
              last.appendChild(ms);
            }
          } else if (event.type === "error") {
            ended = true;
            assistantBubble.classList.add("error");
            assistantBubble.textContent = assistantText || event.data.message;
            if (assistantText) {
              const errRow = addRow("assistant");
              errRow.classList.add("error");
              errRow.textContent = event.data.message;
            }
            addFlowStep(flowSteps, "Error: " + event.data.message, "fail");
            setStatus("");
          } else if (event.type === "done") {
            ended = true;
            if (!toolStepsSeen) {
              addFlowStep(flowSteps, "Guardrail refused — no tools called", "fail");
            } else {
              addFlowStep(flowSteps, "Final answer streamed", "ok");
            }
            setStatus("");
          }
        }
      }
    } finally {
      if (!ended) {
        // Stream closed without a terminal event — an honest signal something
        // went wrong client- or network-side, not a silent success.
        setStatus("");
        addFlowStep(flowSteps, "Stream ended without a terminal event", "fail");
        if (!assistantText) {
          assistantBubble.classList.add("error");
          assistantBubble.textContent = "The response stopped unexpectedly. Please try again.";
        }
      }
      setBusy(false);
      inputEl.focus();
    }
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;
    inputEl.value = "";
    sendMessage(message);
  });

  checkHealth();
  inputEl.focus();
})();
</script>
</body>
</html>
